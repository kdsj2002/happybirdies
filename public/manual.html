<!DOCTYPE html>
<html lang="ko" class="docpage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>배드민턴 대진판 사용 설명서</title>
<!-- 앱을 띄우지 않고 설명서만 보여 주는 페이지다. 링크로 뿌리거나 인쇄해서
     벽에 붙이는 용도라 앱 스크립트(state·store·firebase …)를 전혀 읽지 않는다.
     글 내용은 앱의 도움말 탭과 같은 js/manual.js 하나에서 나온다. -->
<link rel="stylesheet" href="/css/app.css?v=2026.08.20c">
</head>
<body class="docpage">
<div class="doc-lang" id="docLang"></div>
<div id="doc"></div>
<script src="/js/lang.js?v=2026.08.20c"></script>
<script src="/js/i18n-ko.js?v=2026.08.20c"></script>
<script src="/js/i18n-en.js?v=2026.08.20c"></script>
<script src="/js/i18n-zh.js?v=2026.08.20c"></script>
<script src="/js/i18n-ja.js?v=2026.08.20c"></script>
<script src="/js/manual-ko.js?v=2026.08.20c"></script>
<script src="/js/manual-en.js?v=2026.08.20c"></script>
<script src="/js/manual-zh.js?v=2026.08.20c"></script>
<script src="/js/manual-ja.js?v=2026.08.20c"></script>
<script src="/js/manual.js?v=2026.08.20c"></script>
<script>
  /* 언어 전환은 새로고침 없이 그 자리에서 다시 그린다 — manual.html은
     앱을 안 띄우므로 render() 같은 공용 재렌더 경로가 없어 여기서 직접 한다. */
  function draw(){
    document.title = Manual.title();
    document.getElementById('doc').innerHTML = Manual.html() + Manual.footer();
  }
  function drawLangBar(){
    const bar = document.getElementById('docLang');
    bar.innerHTML = Lang.SUPPORTED.map(l =>
      `<button data-l="${l}"${l===Lang.get()?' class="on"':''}>${Lang.NAMES[l]}</button>`).join('');
    bar.querySelectorAll('[data-l]').forEach(b => b.onclick = () => Lang.set(b.dataset.l));
  }
  Lang.onLangChange(() => { draw(); drawLangBar(); });
  draw();
  drawLangBar();
</script>
</body>
</html>
