<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>배드민턴 대진판</title>
<link rel="stylesheet" href="./css/app.css?v=2026.08.11c">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand" id="clubName">대진판<span id="dateLbl"></span></div>
    <div class="stat" id="statLbl"></div>
    <div class="spacer"></div>
    <div class="tabs">
      <button class="tab on" data-scr="board">대진판</button>
      <button class="tab" data-scr="att">출석</button>
      <button class="tab" data-scr="mem">회원</button>
      <button class="tab" data-scr="hist">기록</button>
      <button class="tab" data-scr="set">설정</button>
    </div>
    <button class="btn" id="myBtn" style="display:none"></button>
    <span id="roleLbl"></span>
    <span id="cloudDot" title="저장소 상태" style="width:8px;height:8px;border-radius:50%;background:var(--muted2)"></span>
    <div class="toggle on" id="autoTgl"><span class="dot"></span><span>자동</span></div>
    <button class="btn ghost" id="btnSort">정렬</button>
    <button class="btn ghost" id="btnUndo">↩</button>
  </div>

  <!-- 대진판 -->
  <div class="screen on" id="scr-board">
    <div class="mv-bar mobile-only">
      <div class="seg" id="mvSeg">
        <button data-mv="courts" class="on">🏸 코트</button>
        <button data-mv="queues">대기열</button>
      </div>
    </div>
    <div class="board">
      <div class="courts" id="courts"></div>
      <div class="qwrap">
        <div class="sec-h">대기열<span class="rule"></span></div>
        <div id="queues" style="display:flex;flex-direction:column;gap:9px"></div>
      </div>
    </div>
    <div class="pool">
      <div class="pool-h">
        <b style="color:var(--text)">대기 인원</b><span id="poolCnt"></span>
        <div class="spacer"></div>
        <div class="seg" id="poolSort">
          <button data-s="pri" class="on">순번</button>
          <button data-s="game">게임수</button>
          <button data-s="name">이름</button>
        </div>
        <div class="seg" id="poolSex">
          <button data-x="" class="on">전체</button>
          <button data-x="M">♂</button>
          <button data-x="F">♀</button>
        </div>
      </div>
      <div class="pool-list" id="pool" data-drop="pool"></div>
    </div>
  </div>

  <!-- 출석 -->
  <div class="screen" id="scr-att">
    <div class="bar">
      <div class="seg" id="attSort">
        <button data-s="name" class="on">ㄱㄴㄷ</button>
        <button data-s="grade">급수</button>
        <button data-s="recent">최근</button>
      </div>
      <div class="seg" id="attSex">
        <button data-x="" class="on">전체</button>
        <button data-x="M">♂ 남</button>
        <button data-x="F">♀ 여</button>
      </div>
      <input type="text" id="attQ" placeholder="이름 · 초성 검색" style="width:190px">
      <div class="spacer"></div>
      <div class="stat" id="attStat"></div>
      <button class="btn" id="btnGuest">게스트 추가</button>
      <button class="btn primary" data-scr="board">대진판 →</button>
    </div>
    <div class="pad"><div class="grid-att" id="attGrid"></div></div>
  </div>

  <!-- 회원 -->
  <div class="screen" id="scr-mem">
    <div class="bar">
      <input type="text" id="memQ" placeholder="이름 검색" style="width:190px">
      <div class="spacer"></div>
      <span class="stat" id="memStat"></span>
      <button class="btn" id="btnCsv">CSV 일괄등록</button>
      <button class="btn" id="btnExport">백업</button>
      <button class="btn" id="btnImport">복원</button>
      <button class="btn primary" id="btnAddMem">＋ 회원 추가</button>
    </div>
    <div class="pad"><table id="memTbl"></table></div>
  </div>

  <!-- 기록 -->
  <div class="screen" id="scr-hist"><div class="pad" id="histBody"></div></div>

  <!-- 설정 -->
  <div class="screen" id="scr-set"><div class="pad" id="setBody"></div></div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="ghost"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<div id="safeBar"><b>⚠</b><span></span><button class="btn sm" onclick="location.reload()">새로고침</button></div>
<div id="gate"></div>
<div id="callout"></div>

<!-- Firebase 로더는 모듈, 나머지는 순서대로 읽히는 일반 스크립트다.
     한 파일에 다 몰아넣지 않고 역할별로 나눠 두면 한 군데만 고칠 때
     파일 전체를 다시 쓰지 않아도 된다. 로드 순서에 의존하므로 순서를 지킬 것. -->
<script type="module" src="./js/firebase-loader.js?v=2026.08.11c"></script>
<script src="./js/sound.js?v=2026.08.11c"></script>
<script src="./js/store.js?v=2026.08.11c"></script>
<script src="./js/state.js?v=2026.08.11c"></script>
<script src="./js/algo.js?v=2026.08.11c"></script>
<script src="./js/ui.js?v=2026.08.11c"></script>
<script src="./js/actions.js?v=2026.08.11c"></script>
<script src="./js/auth.js?v=2026.08.11c"></script>
<script src="./js/gate.js?v=2026.08.11c"></script>
<script src="./js/interact.js?v=2026.08.11c"></script>
<script src="./js/screens.js?v=2026.08.11c"></script>
<script src="./js/main.js?v=2026.08.11c"></script>
</body>
</html>
