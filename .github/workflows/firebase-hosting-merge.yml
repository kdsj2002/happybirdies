# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 이 프로젝트는 빌드 단계가 없는 정적 사이트다(public/ 을 그대로 올린다).
      # 자동 생성 템플릿에 있던 `npm ci && npm run build`는 package.json이
      # 없어서 항상 실패했고, 그 탓에 배포 단계까지 가지도 못했다.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPYBIRDIES }}
          channelId: live
          projectId: happybirdies
